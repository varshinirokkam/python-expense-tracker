[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-expense-tracker"
version = "1.0.0"
description = "A dependency-free Python and SQLite personal expense tracker."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "varshinirokkam"}]

[project.scripts]
expense-tracker = "expense_tracker.cli:run"

[tool.setuptools.packages.find]
include = ["expense_tracker*"]
